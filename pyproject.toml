[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samtok-edit-benchmark"
version = "1.0.0"
description = "Fine-grained region-directed image editing benchmark: v1, 450 cases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.9"]
construction = ["opencv-python>=4.8"]
judge = ["vllm", "transformers", "torch", "tqdm"]

[project.scripts]
samtok-benchmark = "samtok_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"samtok_benchmark.review" = ["static/*.html", "static/*.js", "static/*.css", "static/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
