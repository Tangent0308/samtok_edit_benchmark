<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v1 · 人工评测</title><link rel="stylesheet" href="style.css"><script defer src="human.js"></script></head><body>
<div class="layout"><aside class="sidebar"><div class="brand"><h1>v1 人工评测</h1><p id="reviewer"></p></div><nav id="case-list" class="case-list"></nav></aside>
<main class="main"><header class="topbar"><h2 id="title">从左侧选择结果</h2><button id="export">导出 human_scores.jsonl</button></header>
<section id="case-view" hidden><div class="instruction-card"><p id="instruction"></p><p class="muted">按顺序检查：每个目标是否改全 → 未授权部件、邻居与其余场景是否保持 → 是否出现新渲染缺陷。三项独立为 0–4 分；无法确定等级时选 unknown，不用 2/3 代替不确定。漏目标或整部件，完成度最高 2；明确误改再小，保持性最高 2；明确结构缺陷再小，质量最高 2。mask 内未授权属性也需保持；必要局部融合可接受。双图上的轮廓由评测器添加，请忽略；点击图片可按原分辨率查看。<a href="rubric.txt" target="_blank">查看完整评分规则（英文）</a></p></div>
<div class="image-grid"><figure><figcaption>原图</figcaption><a target="_blank" id="before-link"><img id="before"></a></figure><figure><figcaption>编辑结果</figcaption><a target="_blank" id="after-link"><img id="after"></a></figure></div>
<div class="image-grid"><figure><figcaption>原图 + 原始 region 轮廓</figcaption><a target="_blank" id="before-contours-link"><img id="before-contours"></a></figure><figure><figcaption>编辑结果 + 同位置轮廓</figcaption><a target="_blank" id="after-contours-link"><img id="after-contours"></a></figure></div>
<div class="review-card" id="ratings"></div><button id="save" class="pass-button">保存当前人工评分</button><p id="message"></p></section></main></div></body></html>
