<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAMTok Benchmark v2 · 多对象混合交互</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif;color:#192d3c;background:#f0f4f7}body{margin:0}header{background:#142c40;color:white;padding:20px 4vw}h1{font-size:23px;margin:0 0 8px}header p{margin:6px 0;font-size:14px;color:#cce0ec}.bar{position:sticky;top:0;z-index:5;background:white;padding:12px 4vw;display:flex;gap:9px;flex-wrap:wrap;box-shadow:0 2px 6px #182c3b20}input,select,button,textarea{font:inherit;border:1px solid #b9cbd7;border-radius:6px;padding:7px;background:white;color:#192d3c}button{cursor:pointer}button:hover{background:#e4f2ff}main{max-width:1560px;margin:auto;padding:20px}h2{font-size:20px}h3{font-size:16px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.tag{background:#dceaf3;border-radius:20px;padding:5px 12px;font-size:13px}.images{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel,.unit,.review{background:white;border-radius:10px;padding:14px;box-shadow:0 1px 5px #182c3b10}.images img{width:100%;height:440px;object-fit:contain;background:#f4f6f8}.caption{font-size:13px;color:#566c7a}.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;margin:16px 0}.unit{border-top:5px solid var(--color)}.unit p{font-size:14px;line-height:1.6;white-space:pre-wrap}.unit b{color:var(--color)}details{margin:14px 0;background:white;border-radius:8px;padding:14px}summary{cursor:pointer;font-weight:600}.gold img{max-width:100%;height:auto}.prompt{white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace;background:#f5f7fa;padding:12px;overflow:auto}.review textarea{width:96%;min-height:70px}.note{color:#7d5714;background:#fff5dc;padding:12px;border-radius:6px;font-size:14px;line-height:1.7}.empty{padding:60px;text-align:center}a{color:#1767a0}.errors{color:#a21e2d;padding:15px}.jump{width:65px}@media(max-width:850px){.images{grid-template-columns:1fr}.images img{height:330px}.bar{position:static}.units{grid-template-columns:1fr}}
</style>
<header><h1>SAMTok Benchmark v2 · 多对象混合交互</h1><p id="headline"></p><p>一张图的多个不同物体分别执行编辑；所有目标均完成、非目标保持、质量全部过关，整条才通过。</p><p>ref 指文本指代。此页面用于审阅，包含私有 mask；真正发给模型的输入见右图和“实际模型提示词”。</p></header>
<div class="bar"><input id="search" placeholder="搜索 ID、目标、难点…"><select id="source"><option value="">全部来源</option><option>PACO-LVIS</option><option>ADE20K-Part-234</option></select><select id="count"><option value="">全部对象数</option><option value="2">2 对象</option><option value="3">3 对象</option><option value="4">4 对象</option></select><select id="operation"><option value="">全部操作</option><option>attribute</option><option>remove</option><option>replace</option></select><select id="mode"><option value="">全部交互</option></select><button id="prev">← 上一条</button><span id="position"></span><button id="next">下一条 →</button><input id="jump" type="number" min="1" class="jump" aria-label="跳转序号"><button id="go">跳转</button><button id="export">导出个人复核记录</button></div>
<main id="main"></main><div id="errors" class="errors"></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent),all=data.cases,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mode=u=>(u.interaction.has_ref?'ref':'noref')+'+'+u.interaction.locator;
const colors=['#dd244b','#087fb9','#038f5c','#b27600'];let selected=all,pos=0,notes={};
const storageKey='samtok-v2-review-'+data.manifest_sha256;
try{notes=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){$('errors').textContent='当前浏览器不允许本地存储；仍可浏览并导出本次复核记录。'}
$('headline').textContent=`${data.stats.cases} 张独立源图 · ${data.stats.units} 个物理对象目标 · 2–4 对象/条 · 逐图 AI 复核（尚无独立人工复核）`;
for(const m of [...new Set(all.flatMap(c=>c.units.map(mode)))].sort()){const o=document.createElement('option');o.value=m;o.textContent=m==='ref+none'?'ref-only':m;$('mode').append(o)}
function image(path,label){return `<a href="${esc(path)}" target="_blank" rel="noopener"><img src="${esc(path)}" alt="${esc(label)}"></a>`}
function render(){
 $('position').textContent=selected.length?`${pos+1} / ${selected.length}`:'0 / 0';
 if(!selected.length){$('main').innerHTML='<div class="empty">没有符合筛选条件的 case。</div>';return}
 const c=selected[pos],n=notes[c.id]||{};history.replaceState(null,'','#'+encodeURIComponent(c.id));
 $('main').innerHTML=`<h2>${esc(c.id)}</h2><div class="meta"><span class="tag">${esc(c.source.dataset)} / ${esc(c.source.split)}</span><span class="tag">${c.units.length} 个不同物体</span>${c.difficulty.mechanisms.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div><p>${esc(c.difficulty.evidence_zh)}</p><div class="images"><section class="panel"><h3>干净源图（模型第一张输入）</h3>${image(c.source.image,'源图')}<p class="caption">点击图片查看原尺寸。目标可以属于同类对象，但每个 U 都对应不同物理对象。</p></section><section class="panel"><h3>实际混合交互图（模型第二张输入）</h3>${image(c.public_locator_image,'实际用户定位输入')}<p class="caption">点、框、mask 各自与 U 编号绑定；ref-only 对象没有图形提示。</p></section></div><div class="units">${c.units.map((u,i)=>{const p=c.public_units.find(x=>x.id===u.id);return `<article class="unit" style="--color:${colors[i]}"><b>${esc(u.id)} · ${esc(mode(u)==='ref+none'?'ref-only':mode(u))}</b><h3>${esc(u.operation)}${u.attribute_kind?' / '+esc(u.attribute_kind):''} · ${esc(u.target.category)}</h3><p>${esc(p.instruction)}</p><details><summary>审阅用目标、范围与验收条件</summary><p>文本指代：${esc(u.target.ref)}</p><p>编辑范围：${esc(u.target.scope)}</p><p>完成标准：${esc(u.completion_requirement)}</p><p>物理父对象 ID：${esc(u.target.parent_instance_id)}；mask 面积 ${(u.target.geometry.area_fraction*100).toFixed(2)}%；有效连通块 ${u.target.geometry.significant_components}。连通块不作为多个对象计数。</p>${image(u.target.mask,'私有目标 mask')}</details></article>`}).join('')}</div><details><summary>实际模型提示词（仅含被提供的 ref 和定位形式）</summary><div class="prompt">${esc(c.public_prompt)}</div></details><details class="gold"><summary>私有标注总览与局部放大（不发送给模型）</summary>${image(c.final_review,'最终入选目标及局部放大')}<p>此图仅显示最终入选目标，编号与本页输入一致。原始候选审阅卡可能含未入选目标、采用旧编号，见 <a href="${esc(c.review.card)}" target="_blank" rel="noopener">初筛卡</a>。</p></details><p class="note">评分须逐对象记录 E（目标选择与完整完成）、P（非目标保持）、Q（自然质量），并检查全图 P/Q；任一项失败即整条失败。mask 是源图目标定位标注，移除/替换的合理像素变化范围需按语义判断，不能直接用源 mask 的像素差代替质量评测。</p><section class="review"><h3>个人复核（保存于此浏览器；不改冻结数据）</h3><select id="decision"><option value="pending">未人工复核</option><option value="accept">确认保留</option><option value="revise">需要修改</option><option value="reject">建议剔除</option></select><input id="reviewer" placeholder="实际复核人姓名 / ID" value="${esc(n.reviewer||'')}"><p><textarea id="note" placeholder="具体问题：实例指代、mask 边界、任务是否合理…">${esc(n.note||'')}</textarea></p><button id="save">保存本条记录</button><span id="saved"></span></section>`;
 $('decision').value=n.decision||'pending';$('save').onclick=()=>{notes[c.id]={case_id:c.id,decision:$('decision').value,note:$('note').value,reviewer:$('reviewer').value,review_kind:'user_entered_unverified_identity',reviewed_at:new Date().toISOString(),manifest_sha256:data.manifest_sha256};try{localStorage.setItem(storageKey,JSON.stringify(notes));$('saved').textContent=' 已保存'}catch(e){$('saved').textContent=' 当前仅保存在内存，请立即导出'}};
 document.querySelectorAll('img').forEach(im=>im.onerror=()=>{$('errors').textContent='图片缺失：请将完整数据包解压后打开 index.html，保留 assets 和 inputs_visual 子目录；不要只下载 HTML 文件。'});
}
function filter(){const q=$('search').value.toLowerCase();selected=all.filter(c=>(!$('source').value||c.source.dataset===$('source').value)&&(!$('count').value||c.units.length===+$('count').value)&&(!$('operation').value||c.units.some(u=>u.operation===$('operation').value))&&(!$('mode').value||c.units.some(u=>mode(u)===$('mode').value))&&(!q||JSON.stringify(c).toLowerCase().includes(q)));pos=0;render()}
for(const id of ['search','source','count','operation','mode'])$(id).addEventListener(id==='search'?'input':'change',filter);
$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos+1<selected.length){pos++;render()}};$('go').onclick=()=>{const n=+$('jump').value;if(n>=1&&n<=selected.length){pos=n-1;render()}};
$('export').onclick=()=>{const blob=new Blob([Object.values(notes).map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/x-ndjson'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='v2_personal_reviews.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});
const requested=decodeURIComponent(location.hash.slice(1)),initial=all.findIndex(c=>c.id===requested);if(initial>=0)pos=initial;render();
</script></html>
